name: Publish to NPM and Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.5)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
      
      - name: Update version in package.json
        run: |
          npm version ${{ github.event.inputs.version }} --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ github.event.inputs.version }}"
          git push
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build package
        run: pnpm build
      
      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Create Git tag
        run: |
          git tag -a "v${{ github.event.inputs.version }}" -m "Release v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"
      
      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "v${{ github.event.inputs.version }}" | head -n1)
          echo "PREV_TAG=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV_TAG"
      
      - name: Generate changelog
        run: |
          VERSION="${{ github.event.inputs.version }}"
          
          if [ -z "${{ steps.prev_tag.outputs.PREV_TAG }}" ]; then
            echo "## 🎉 Primera versión oficial de MTMI Async Badges" > changelog.md
          else
            echo "## 📝 Cambios desde ${{ steps.prev_tag.outputs.PREV_TAG }}" > changelog.md
            echo "" >> changelog.md
            git log ${{ steps.prev_tag.outputs.PREV_TAG }}..HEAD --pretty=format:'- %s' --no-merges >> changelog.md
            echo "" >> changelog.md
          fi
          
          echo "" >> changelog.md
          echo "### ✨ Características" >> changelog.md
          echo "" >> changelog.md
          echo "- ✅ **389 badges globales de Twitch** disponibles en formato JSON" >> changelog.md
          echo "- ✅ **Integración con MTMI**: Pasa el objeto badges directamente al cliente" >> changelog.md
          echo "- ✅ **Carga asíncrona**: Los badges se cargan desde el CDN cuando se necesitan" >> changelog.md
          echo "- ✅ **TypeScript completo**: Definiciones de tipos incluidas" >> changelog.md
          echo "- ✅ **Dual format**: ESM y CommonJS (compatible con Node.js y navegadores)" >> changelog.md
          echo "- ✅ **Disponible via npm**: \`npm install mtmi-async-badges\`" >> changelog.md
          echo "- ✅ **Disponible via unpkg**: Sin instalación, directo en el navegador" >> changelog.md
          echo "- ✅ **Actualización automática**: GitHub Action que actualiza badges semanalmente" >> changelog.md
          echo "" >> changelog.md
          echo "### 📦 Instalación" >> changelog.md
          echo "" >> changelog.md
          echo "\`\`\`bash" >> changelog.md
          echo "npm install mtmi-async-badges@${VERSION}" >> changelog.md
          echo "\`\`\`" >> changelog.md
          echo "" >> changelog.md
          echo "### 🚀 Uso con MTMI" >> changelog.md
          echo "" >> changelog.md
          echo "\`\`\`javascript" >> changelog.md
          echo "import badges from 'mtmi-async-badges';" >> changelog.md
          echo "import { client } from 'mtmi';" >> changelog.md
          echo "" >> changelog.md
          echo "client.connect({ " >> changelog.md
          echo "  channels: ['tu_canal'], " >> changelog.md
          echo "  badges," >> changelog.md
          echo "  avatarProvider: 'decapi' " >> changelog.md
          echo "});" >> changelog.md
          echo "\`\`\`" >> changelog.md
          echo "" >> changelog.md
          echo "### 📚 Documentación" >> changelog.md
          echo "" >> changelog.md
          echo "- [README completo](https://github.com/chrisvdev/mtmi-async-badges)" >> changelog.md
          echo "- [npm package](https://www.npmjs.com/package/mtmi-async-badges)" >> changelog.md
          echo "- [unpkg CDN](https://unpkg.com/mtmi-async-badges@${VERSION}/dist/index.js)" >> changelog.md
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.version }}"
          name: "🎖️ v${{ github.event.inputs.version }}"
          body_path: changelog.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Success notification
        run: |
          echo "🎉 Successfully published version ${{ github.event.inputs.version }} to npm!"
          echo "📦 Package: mtmi-async-badges@${{ github.event.inputs.version }}"
          echo "🏷️ Tag: v${{ github.event.inputs.version }}"
          echo "📝 Release created on GitHub"
