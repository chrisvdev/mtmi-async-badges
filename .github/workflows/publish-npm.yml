name: Publish to NPM

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'

# Permisos necesarios
permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version-changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Get current version
        id: package
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      
      - name: Check if version changed
        id: check
        run: |
          git diff HEAD^ HEAD -- package.json > changes.txt
          if grep -q '"version"' changes.txt; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Version changed in package.json"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No version change detected"
          fi
  
  publish:
    needs: check-version
    if: needs.check-version.outputs.version-changed == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build package
        run: pnpm build
      
      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ needs.check-version.outputs.version }}" -m "Release v${{ needs.check-version.outputs.version }}"
          git push origin "v${{ needs.check-version.outputs.version }}"
      
      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "v${{ needs.check-version.outputs.version }}" | head -n1)
          echo "PREV_TAG=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV_TAG"
      
      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          
          if [ -z "${{ steps.prev_tag.outputs.PREV_TAG }}" ]; then
            cat > changelog.md << 'EOF'
## 🎉 Primera versión oficial de MTMI Async Badges
EOF
          else
            echo "## 📝 Cambios desde ${{ steps.prev_tag.outputs.PREV_TAG }}" > changelog.md
            echo "" >> changelog.md
            git log ${{ steps.prev_tag.outputs.PREV_TAG }}..HEAD --pretty=format:'- %s' --no-merges >> changelog.md
            echo "" >> changelog.md
          fi
          
          cat >> changelog.md << 'EOF'

### ✨ Características

- ✅ **389 badges globales de Twitch** disponibles en formato JSON
- ✅ **Integración con MTMI**: Pasa el objeto badges directamente al cliente
- ✅ **Carga asíncrona**: Los badges se cargan desde el CDN cuando se necesitan
- ✅ **TypeScript completo**: Definiciones de tipos incluidas
- ✅ **Dual format**: ESM y CommonJS (compatible con Node.js y navegadores)
- ✅ **Disponible via npm**: \`npm install mtmi-async-badges\`
- ✅ **Disponible via unpkg**: Sin instalación, directo en el navegador
- ✅ **Actualización automática**: GitHub Action que actualiza badges semanalmente

### 📦 Instalación

\`\`\`bash
npm install mtmi-async-badges@${VERSION}
\`\`\`

### 🚀 Uso con MTMI

\`\`\`javascript
import badges from 'mtmi-async-badges';
import { client } from 'mtmi';

client.connect({ 
  channels: ['tu_canal'], 
  badges,
  avatarProvider: 'decapi' 
});
\`\`\`

### 📚 Documentación

- [README completo](https://github.com/chrisvdev/mtmi-async-badges#readme)
- [npm package](https://www.npmjs.com/package/mtmi-async-badges)
- [unpkg CDN](https://unpkg.com/mtmi-async-badges@${VERSION}/dist/index.js)
EOF
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.check-version.outputs.version }}"
          name: "🎖️ v${{ needs.check-version.outputs.version }}"
          body_path: changelog.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Success notification
        run: |
          echo "🎉 Successfully published version ${{ needs.check-version.outputs.version }} to npm!"
          echo "📦 Package: mtmi-async-badges@${{ needs.check-version.outputs.version }}"
          echo "🏷️ Tag: v${{ needs.check-version.outputs.version }}"
          echo "📝 Release created on GitHub"
