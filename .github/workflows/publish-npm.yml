name: Publish to NPM and Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.5)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
      
      - name: Update version in package.json
        run: |
          npm version ${{ github.event.inputs.version }} --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ github.event.inputs.version }}"
          git push
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build package
        run: pnpm build
      
      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Create Git tag
        run: |
          git tag -a "v${{ github.event.inputs.version }}" -m "Release v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"
      
      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "v${{ github.event.inputs.version }}" | head -n1)
          echo "PREV_TAG=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV_TAG"
      
      - name: Generate changelog
        run: |
          VERSION="${{ github.event.inputs.version }}"
          
          if [ -z "${{ steps.prev_tag.outputs.PREV_TAG }}" ]; then
            cat > changelog.md << 'EOF'
## 🎉 Primera versión oficial de MTMI Async Badges
EOF
          else
            echo "## 📝 Cambios desde ${{ steps.prev_tag.outputs.PREV_TAG }}" > changelog.md
            echo "" >> changelog.md
            git log ${{ steps.prev_tag.outputs.PREV_TAG }}..HEAD --pretty=format:'- %s' --no-merges >> changelog.md
            echo "" >> changelog.md
          fi
          
          cat >> changelog.md << 'EOF'

### ✨ Características

- ✅ **389 badges globales de Twitch** disponibles en formato JSON
- ✅ **Integración con MTMI**: Pasa el objeto badges directamente al cliente
- ✅ **Carga asíncrona**: Los badges se cargan desde el CDN cuando se necesitan
- ✅ **TypeScript completo**: Definiciones de tipos incluidas
- ✅ **Dual format**: ESM y CommonJS (compatible con Node.js y navegadores)
- ✅ **Disponible via npm**: \`npm install mtmi-async-badges\`
- ✅ **Disponible via unpkg**: Sin instalación, directo en el navegador
- ✅ **Actualización automática**: GitHub Action que actualiza badges semanalmente

### 📦 Instalación

\`\`\`bash
npm install mtmi-async-badges@${VERSION}
\`\`\`

### 🚀 Uso con MTMI

\`\`\`javascript
import badges from 'mtmi-async-badges';
import { client } from 'mtmi';

client.connect({ 
  channels: ['tu_canal'], 
  badges,
  avatarProvider: 'decapi' 
});
\`\`\`

### 📚 Documentación

- [README completo](https://github.com/chrisvdev/mtmi-async-badges#readme)
- [npm package](https://www.npmjs.com/package/mtmi-async-badges)
- [unpkg CDN](https://unpkg.com/mtmi-async-badges@${VERSION}/dist/index.js)
EOF
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.version }}"
          name: "🎖️ v${{ github.event.inputs.version }}"
          body_path: changelog.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Success notification
        run: |
          echo "🎉 Successfully published version ${{ github.event.inputs.version }} to npm!"
          echo "📦 Package: mtmi-async-badges@${{ github.event.inputs.version }}"
          echo "🏷️ Tag: v${{ github.event.inputs.version }}"
          echo "📝 Release created on GitHub"
